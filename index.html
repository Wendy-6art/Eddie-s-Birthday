<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Bae 💙</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: "Trebuchet MS", sans-serif;
      background: linear-gradient(135deg, #071a3d, #0b4f9c, #56b4ff);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .glow {
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      filter: blur(60px);
      animation: glow 5s infinite alternate;
    }

    .card {
      width: 90%;
      max-width: 500px;
      padding: 35px 25px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(12px);
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.25);
      animation: appear 1.2s ease;
      z-index: 2;
    }

    h1 {
      margin-top: 0;
      font-size: 2.2rem;
      text-shadow: 0 3px 12px rgba(0, 0, 0, 0.3);
    }

    .message {
      font-size: 1.1rem;
      line-height: 1.8;
    }

    .love {
      margin-top: 25px;
      font-size: 1.15rem;
      font-weight: bold;
    }

    .tap {
      margin-top: 25px;
      font-size: 0.9rem;
      opacity: 0.8;
      animation: pulse 2s infinite;
    }

    .heart {
      position: fixed;
      pointer-events: none;
      font-size: 24px;
      z-index: 10;
      animation: fly 1.5s ease-out forwards;
    }

    .floating-heart {
      position: fixed;
      bottom: -30px;
      pointer-events: none;
      opacity: 0.5;
      animation: floatUp linear infinite;
      z-index: 1;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes glow {
      from {
        transform: scale(0.9);
      }
      to {
        transform: scale(1.2);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.6;
      }
      50% {
        opacity: 1;
      }
    }

    @keyframes fly {
      0% {
        transform: translate(0, 0) scale(0.5) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translate(var(--x), var(--y)) scale(1.4) rotate(25deg);
        opacity: 0;
      }
    }

    @keyframes floatUp {
      from {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      20% {
        opacity: 0.5;
      }

      to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <div class="glow"></div>

  <div class="card">
    <h1>Happy Birthday bae ❤️💋</h1>

    <div class="message">
      Ilysm, thanks for always being there for me and always understanding me.
      <br><br>

      Always know I will be there for you and I will never leave you.
      <br><br>

      I loveeee youuuu soo muchhhh 🥹❤️
      <br><br>

      Muahhhhhh 💋
    </div>

    <div class="love">
      Love, Wendy ❤️
    </div>

    <div class="tap">
      Tap anywhere 💙✨
    </div>
  </div>

  <script>
    // Hearts when he taps anywhere
    document.addEventListener("click", function(event) {
      for (let i = 0; i < 12; i++) {
        const heart = document.createElement("div");
        heart.className = "heart";

        const hearts = ["❤️", "💙", "💗", "💜", "🤍"];
        heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];

        heart.style.left = event.clientX + "px";
        heart.style.top = event.clientY + "px";

        const x = (Math.random() - 0.5) * 250;
        const y = -Math.random() * 250 - 50;

        heart.style.setProperty("--x", x + "px");
        heart.style.setProperty("--y", y + "px");

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 1500);
      }
    });

    // Floating hearts in the background
    function createFloatingHeart() {
      const heart = document.createElement("div");
      heart.className = "floating-heart";

      const hearts = ["💙", "🤍", "💗", "❤️"];
      heart.innerHTML = hearts[Math.floor(Math.random() * hearts.length)];

      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (15 + Math.random() * 25) + "px";
      heart.style.animationDuration = (5 + Math.random() * 6) + "s";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 11000);
    }

    setInterval(createFloatingHeart, 500);
  </script>

</body>
</html>
